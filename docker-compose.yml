version: '3.8'

services:
  frontend:
    build: ./Frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - stockflow-network

  backend:
    build: ./Backend
    ports:
      - "5000:5000"
    env_file:
      - ./Backend/.env
    networks:
      - stockflow-network

networks:
  stockflow-network:
    driver: bridge